x-model-hosts: &model-hosts
  - "model.frodo.com:${MODEL_HOST_IP:-10.250.110.99}"

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    profiles: ["local-infra"]
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agent-postgres:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.4-alpine
    profiles: ["local-infra"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agent-redis:/data

  test-postgres:
    image: pgvector/pgvector:0.8.6-pg17
    profiles: ["test"]
    environment:
      POSTGRES_DB: agent_test
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro

  test-redis:
    image: redis:7.4-alpine
    profiles: ["test"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data

  migrate:
    build: .
    command: ["ex-agent-migrate"]
    environment: &agent-environment
      AGENT_DATABASE_URL: >-
        ${AGENT_DATABASE_URL:-postgresql+psycopg://agent:agent@host.docker.internal:5432/agent}
      AGENT_CHECKPOINT_DATABASE_URL: >-
        ${AGENT_CHECKPOINT_DATABASE_URL:-postgresql://agent:agent@host.docker.internal:5432/agent}
      AGENT_REDIS_URL: >-
        ${AGENT_REDIS_URL:-redis://host.docker.internal:6379/0}
      EXECUTOR_BASE_URL: >-
        ${EXECUTOR_BASE_URL:-http://host.docker.internal:8000/api/v1}
      EXECUTOR_SHARED_STORAGE_ROOT: /workspace/shared
      EXECUTOR_SOURCE_MODE: PATH
      EXECUTOR_RESULT_CONTEXT_MAX_CHARS: >-
        ${EXECUTOR_RESULT_CONTEXT_MAX_CHARS:-20000}
      EXECUTOR_RESULT_MANIFEST_MAX_BYTES: >-
        ${EXECUTOR_RESULT_MANIFEST_MAX_BYTES:-2097152}
      EXECUTOR_FAILURE_CLEANUP_TIMEOUT_SECONDS: >-
        ${EXECUTOR_FAILURE_CLEANUP_TIMEOUT_SECONDS:-60}
      EXECUTOR_FAILURE_CLEANUP_POLL_SECONDS: >-
        ${EXECUTOR_FAILURE_CLEANUP_POLL_SECONDS:-0.5}
      AGENT_MODEL: ${AGENT_MODEL:-qwen38-27b-fp8}
      AGENT_MODEL_PROVIDER: ${AGENT_MODEL_PROVIDER:-openai}
      AGENT_MODEL_BASE_URL: >-
        ${AGENT_MODEL_BASE_URL:-http://model.frodo.com/v1}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-EMPTY}
      AGENT_MODEL_ENABLE_THINKING: >-
        ${AGENT_MODEL_ENABLE_THINKING:-false}
      AGENT_EMBEDDING_PROVIDER: >-
        ${AGENT_EMBEDDING_PROVIDER:-dummy}
      AGENT_EMBEDDING_MODEL: >-
        ${AGENT_EMBEDDING_MODEL:-dummy-hash-v1}
      AGENT_EMBEDDING_BASE_URL: >-
        ${AGENT_EMBEDDING_BASE_URL:-http://model.frodo.com/v1}
      AGENT_EMBEDDING_API_KEY: >-
        ${AGENT_EMBEDDING_API_KEY:-EMPTY}
      AGENT_EMBEDDING_DIMENSIONS: >-
        ${AGENT_EMBEDDING_DIMENSIONS:-1024}
      AGENT_SKILL_ROOT: ${AGENT_SKILL_ROOT:-/app/skills}
      WORKER_COMMAND_CONCURRENCY: >-
        ${WORKER_COMMAND_CONCURRENCY:-4}
      WORKER_INSTANCE_ID: ${WORKER_INSTANCE_ID:-}
      WORKER_EXECUTOR_EVENT_CONCURRENCY: >-
        ${WORKER_EXECUTOR_EVENT_CONCURRENCY:-8}
      CHECKPOINT_POOL_MIN_SIZE: >-
        ${CHECKPOINT_POOL_MIN_SIZE:-1}
      CHECKPOINT_POOL_MAX_SIZE: >-
        ${CHECKPOINT_POOL_MAX_SIZE:-8}
      TASK_LOCK_TTL_SECONDS: ${TASK_LOCK_TTL_SECONDS:-60}
      TASK_LOCK_RENEW_INTERVAL_SECONDS: >-
        ${TASK_LOCK_RENEW_INTERVAL_SECONDS:-10}
      STREAM_CLAIM_BATCH_SIZE: ${STREAM_CLAIM_BATCH_SIZE:-10}
      COMMAND_MAX_RETRY_ATTEMPTS: >-
        ${COMMAND_MAX_RETRY_ATTEMPTS:-5}
      EXECUTOR_EVENT_MAX_RETRY_ATTEMPTS: >-
        ${EXECUTOR_EVENT_MAX_RETRY_ATTEMPTS:-100}
      STREAM_RETRY_STATE_TTL_SECONDS: >-
        ${STREAM_RETRY_STATE_TTL_SECONDS:-604800}
      DLQ_ACTION_MARKER_TTL_SECONDS: >-
        ${DLQ_ACTION_MARKER_TTL_SECONDS:-7776000}
      STREAM_RETENTION_SECONDS: >-
        ${STREAM_RETENTION_SECONDS:-604800}
      STREAM_MINIMUM_RETAINED_ENTRIES: >-
        ${STREAM_MINIMUM_RETAINED_ENTRIES:-1000}
      CONSUMER_GC_IDLE_MILLISECONDS: >-
        ${CONSUMER_GC_IDLE_MILLISECONDS:-86400000}
      AGENT_COMMAND_DEAD_LETTER_STREAM: >-
        ${AGENT_COMMAND_DEAD_LETTER_STREAM:-agent.commands.dlq}
      EXECUTOR_EVENT_DEAD_LETTER_STREAM: >-
        ${EXECUTOR_EVENT_DEAD_LETTER_STREAM:-executor.events.agent-dlq}
      EXECUTOR_WORKER_NAMESPACE: >-
        ${EXECUTOR_WORKER_NAMESPACE:-agent-executor-worker}
      AGENT_RECOVERY_CONCURRENCY: ${AGENT_RECOVERY_CONCURRENCY:-4}
      AGENT_RECOVERY_BATCH_SIZE: ${AGENT_RECOVERY_BATCH_SIZE:-32}
      AGENT_REQUEST_RECOVERY_POLL_SECONDS: >-
        ${AGENT_REQUEST_RECOVERY_POLL_SECONDS:-2}
      AGENT_FAILURE_RECOVERY_POLL_SECONDS: >-
        ${AGENT_FAILURE_RECOVERY_POLL_SECONDS:-5}
      AGENT_FAILURE_MAX_ATTEMPTS: ${AGENT_FAILURE_MAX_ATTEMPTS:-20}
      AGENT_FAILURE_RETRY_SECONDS: ${AGENT_FAILURE_RETRY_SECONDS:-5}
      AGENT_FAILURE_OPERATOR_USER_IDS: >-
        ${AGENT_FAILURE_OPERATOR_USER_IDS:-}
      EXECUTOR_EVENT_CLAIM_IDLE_MILLISECONDS: >-
        ${EXECUTOR_EVENT_CLAIM_IDLE_MILLISECONDS:-30000}
      EXECUTOR_EVENT_LOCK_TTL_SECONDS: >-
        ${EXECUTOR_EVENT_LOCK_TTL_SECONDS:-60}
      EXECUTOR_EVENT_LOCK_RENEW_INTERVAL_SECONDS: >-
        ${EXECUTOR_EVENT_LOCK_RENEW_INTERVAL_SECONDS:-10}
      OUTBOX_POLL_MILLISECONDS: ${OUTBOX_POLL_MILLISECONDS:-100}
      OUTBOX_IDLE_MAX_MILLISECONDS: >-
        ${OUTBOX_IDLE_MAX_MILLISECONDS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_CLAIM_TIMEOUT_SECONDS: >-
        ${OUTBOX_CLAIM_TIMEOUT_SECONDS:-30}
      PRODUCT_EVENT_STREAM_MAXLEN: >-
        ${PRODUCT_EVENT_STREAM_MAXLEN:-100000}
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-15}
      WORKER_RETRY_INITIAL_SECONDS: >-
        ${WORKER_RETRY_INITIAL_SECONDS:-0.5}
      WORKER_RETRY_MAX_SECONDS: ${WORKER_RETRY_MAX_SECONDS:-30}
      WORKER_SHUTDOWN_GRACE_SECONDS: >-
        ${WORKER_SHUTDOWN_GRACE_SECONDS:-25}
      WORKER_METRICS_ENABLED: ${WORKER_METRICS_ENABLED:-true}
      WORKER_METRICS_HOST: ${WORKER_METRICS_HOST:-0.0.0.0}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-8011}
      WORKER_METRICS_REFRESH_SECONDS: >-
        ${WORKER_METRICS_REFRESH_SECONDS:-10}
      READINESS_PROBE_TIMEOUT_SECONDS: >-
        ${READINESS_PROBE_TIMEOUT_SECONDS:-2}
      WORKER_READINESS_STALE_SECONDS: >-
        ${WORKER_READINESS_STALE_SECONDS:-30}
    extra_hosts: *model-hosts
    restart: "no"

  api:
    build: .
    command: ["ex-agent-api"]
    environment: *agent-environment
    extra_hosts: *model-hosts
    ports:
      - "8010:8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8010/readyz', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${EXECUTOR_SHARED_DIR:-./shared_dir}:/workspace/shared

  worker:
    build: .
    command: ["ex-agent-worker"]
    environment: *agent-environment
    extra_hosts: *model-hosts
    ports:
      - "8011:8011"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8011/health/ready',
          timeout=3)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${EXECUTOR_SHARED_DIR:-./shared_dir}:/workspace/shared

  test-migrate:
    build: .
    profiles: ["test"]
    command: ["ex-agent-migrate"]
    environment:
      <<: *agent-environment
      AGENT_DATABASE_URL: >-
        postgresql+psycopg://agent:agent@test-postgres:5432/agent_test
      AGENT_CHECKPOINT_DATABASE_URL: >-
        postgresql://agent:agent@test-postgres:5432/agent_test
      AGENT_REDIS_URL: redis://test-redis:6379/0
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    restart: "no"

  test:
    build:
      context: .
      target: test
    command:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - pytest
      - -m
      - postgres or redis
    environment:
      <<: *agent-environment
      AGENT_DATABASE_URL: >-
        postgresql+psycopg://agent:agent@test-postgres:5432/agent_test
      AGENT_CHECKPOINT_DATABASE_URL: >-
        postgresql://agent:agent@test-postgres:5432/agent_test
      AGENT_REDIS_URL: redis://test-redis:6379/0
      TEST_DATABASE_URL: >-
        postgresql+psycopg://agent:agent@test-postgres:5432/agent_test
      TEST_REDIS_URL: redis://test-redis:6379/0
    extra_hosts: *model-hosts
    depends_on:
      test-migrate:
        condition: service_completed_successfully
      test-redis:
        condition: service_healthy
    profiles: ["test"]

volumes:
  agent-postgres:
  agent-redis:
