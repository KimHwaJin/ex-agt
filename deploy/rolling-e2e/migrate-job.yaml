apiVersion: batch/v1
kind: Job
metadata:
  name: ex-agent-migrate
  labels:
    app.kubernetes.io/name: ex-agent-migrate
    app.kubernetes.io/part-of: ex-agent-rolling-e2e
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ex-agent-migrate
        app.kubernetes.io/part-of: ex-agent-rolling-e2e
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostAliases:
        - ip: "10.250.110.99"
          hostnames: ["model.frodo.com"]
      containers:
        - name: migrate
          image: ex-agent:rolling-e2e
          imagePullPolicy: Never
          args: ["ex-agent-migrate"]
          envFrom:
            - configMapRef:
                name: ex-agent-runtime
            - secretRef:
                name: ex-agent-runtime
