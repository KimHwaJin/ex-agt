name: ex-agent-worker-foundation-test
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: worker_test
      POSTGRES_USER: worker
      POSTGRES_PASSWORD: worker-test-only
    healthcheck:
      test: [CMD-SHELL, pg_isready -U worker -d worker_test]
      interval: 1s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 2s
      retries: 30
    tmpfs:
      - /data
  test:
    build:
      context: ../..
      target: test
    command: [python, -m, pytest, -q, -p, no:cacheprovider, tests/worker]
    environment:
      TEST_DATABASE_URL: >-
        postgresql+psycopg://worker:worker-test-only@postgres:5432/worker_test
      TEST_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
