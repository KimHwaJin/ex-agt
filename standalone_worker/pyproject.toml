[project]
name = "executor-worker"
version = "0.1.0"
description = "Copyable durable Executor event worker"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "httpx>=0.28,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "redis>=6.4,<7",
    "prometheus-client>=0.22,<1",
    "sqlalchemy[asyncio]>=2.0.43,<3",
]

[project.optional-dependencies]
langgraph = ["langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "ty>=0.0.1a17,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = ["redis: real Redis", "postgres: real PostgreSQL"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ty.environment]
python-version = "3.12"
