[project]
name = "ex-agent"
version = "0.1.0"
description = "Durable data-analysis agent workflow for Executor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langchain>=1.1,<2",
    "langchain-core>=1.1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langsmith>=0.3,<1",
    "orjson>=3.10,<4",
    "pgvector>=0.4,<1",
    "prometheus-client>=0.22,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "redis>=6.4,<7",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
ex-agent-api = "ex_agent.main:run_api"
ex-agent-worker = "ex_agent.worker_main:run_worker"
ex-agent-dlq = "ex_agent.dlq_main:run_dlq_cli"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
    "ty>=0.0.1a17,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: requires the Compose PostgreSQL service",
    "redis: requires the Compose Redis service",
    "executor: requires the Executor REST service",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"src/ex_agent/api/*.py" = ["B008"]
"src/ex_agent/api/**/*.py" = ["B008"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["migrations/versions", "skills"]
