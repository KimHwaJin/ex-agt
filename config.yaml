# 운영용 템플릿. 연결 모듈과 비밀값이 준비되지 않으면 시작하지 않습니다.
environment: production
agent_backend: disabled
embedded_run_worker: false
checkpoint_database_url: null
checkpoint_database_url_env: CHECKPOINT_DATABASE_URL
checkpoint_schema: agent_checkpoints
checkpoint_pool_max_size: 5
worker_concurrency: 2
model_name: null
model_name_env: AGENT_MODEL_NAME
model_provider: openai
model_provider_env: AGENT_MODEL_PROVIDER
model_base_url: null
model_base_url_env: AGENT_MODEL_BASE_URL
model_api_key: null
model_api_key_env: AGENT_MODEL_API_KEY
# 실제 연결 URL의 DB 이름은 chatapp으로 지정합니다.
database_url: null
database_url_env: MANAGEMENT_DATABASE_URL
cursor_secret: null
cursor_secret_env: MANAGEMENT_CURSOR_SECRET
auth_mode: external
identity_provider_factory: null
logging_mode: host
logging_initializer: null
logging_yaml: null
pool_min_size: 1
pool_max_size: 10
pool_timeout: 10
bind_host: 0.0.0.0
bind_port: 8020
